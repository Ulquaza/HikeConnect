services:
  api:
    build:
      context: .
      dockerfile: HikeConnect.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      JwtSettings__SecretKey: ${JwtSettings__SecretKey}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1}
      # Twenty CRM — см. .env.example (ключ и имя хоста обязательно проверить под ваш compose Twenty + hike_net)
      Crm__Twenty__Enabled: ${Crm__Twenty__Enabled:-true}
      Crm__Twenty__BaseUrl: ${Crm__Twenty__BaseUrl:-http://server:3000}
      Crm__Twenty__ApiKey: ${Crm__Twenty__ApiKey:-}
      Crm__Twenty__GraphQlPath: ${Crm__Twenty__GraphQlPath:-graphql}
      Crm__Twenty__ObjectPluralName: ${Crm__Twenty__ObjectPluralName:-behavioralleads}
      Crm__Twenty__CreateInputTypeName: ${Crm__Twenty__CreateInputTypeName:-BehavioralLeadCreateInput}
      Crm__Twenty__CreateManyMutationName: ${Crm__Twenty__CreateManyMutationName:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hike_net

  webapp:
    build:
      context: .
      dockerfile: HikeConnect.WebApp/Dockerfile
    ports:
      - "9011:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - hike_net

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - hike_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

networks:
  hike_net:
    name: hike_net
    driver: bridge
